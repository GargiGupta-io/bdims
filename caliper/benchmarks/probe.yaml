# Pipeline check against the temporary probe contracts.
# Copy this to bdims.yaml and swap in the real rounds once the contracts exist.
test:
  name: bdims-probe
  description: Proves the Caliper pipeline end to end before the real contracts land.
  workers:
    number: 2
  rounds:
    - label: registerBatch
      description: Write. Registers a batch, which also writes to a second contract.
      txNumber: 200
      rateControl:
        type: fixed-rate
        opts:
          tps: 20
      workload:
        module: workloads/probe/register-batch.js
    - label: getBatch
      description: Read. Looks up random existing batches.
      txNumber: 1000
      rateControl:
        type: fixed-rate
        opts:
          tps: 200
      workload:
        module: workloads/probe/get-batch.js
